name: Build Windows installer

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub Release tag to update
        required: true
        default: v2026.08.8

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Check out Amalia
        uses: actions/checkout@v4

      - name: Install Qt, WebEngine and Qt Installer Framework
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtwebengine qtwebsockets qtpositioning qtwebchannel
          tools: tools_ifw,qt.tools.ifw.47
          cache: true

      - name: Install verified OpenSSL 3.5.9
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "Win64OpenSSL-3_5_9.exe"
          Invoke-WebRequest -Uri "https://slproweb.com/download/Win64OpenSSL-3_5_9.exe" -OutFile $installer
          $expectedHash = "5fe338c81d62515df7292f16542a0eef2a29db3efc023cd5a8c08ec3c97027ae"
          $actualHash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) { throw "OpenSSL installer SHA-256 mismatch" }
          $process = Start-Process -FilePath $installer -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "OpenSSL installer failed with exit code $($process.ExitCode)" }

      - name: Locate OpenSSL and installer tools
        shell: pwsh
        run: |
          $crypto = Get-ChildItem -Path "$env:ProgramFiles/OpenSSL*" -Recurse -Filter libcrypto-3-x64.dll | Select-Object -First 1
          $binaryCreator = Get-ChildItem -Path $env:IQTA_TOOLS -Recurse -Filter binarycreator.exe | Select-Object -First 1
          if (-not $crypto) { throw "OpenSSL 3 runtime was not found" }
          if (-not $binaryCreator) { throw "Qt Installer Framework binarycreator.exe was not found" }
          "OPENSSL_ROOT_DIR=$($crypto.Directory.Parent.FullName)" >> $env:GITHUB_ENV
          "BINARYCREATOR=$($binaryCreator.FullName)" >> $env:GITHUB_ENV

      - name: Enable Visual Studio 2022 x64 compiler
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build and install QtKeychain
        shell: pwsh
        run: |
          git clone --depth 1 --branch v0.14.0 https://github.com/frankosterfeld/qtkeychain.git qtkeychain-src
          cmake -S qtkeychain-src -B qtkeychain-build -G Ninja `
            -DBUILD_WITH_QT6=ON `
            -DBUILD_TEST_APPLICATION=OFF `
            -DBUILD_TRANSLATIONS=OFF `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="$pwd/qtkeychain-install"
          cmake --build qtkeychain-build --config Release
          cmake --install qtkeychain-build --config Release

      - name: Build Amalia
        shell: pwsh
        run: |
          cmake --preset windows-release `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR;$pwd/qtkeychain-install" `
            -DOPENSSL_ROOT_DIR="$env:OPENSSL_ROOT_DIR" `
            -DAMALIA_UPDATE_PUBLIC_KEY="$pwd/keys/update-public.pem"
          cmake --build --preset windows-release --config Release
          cmake --install build/windows-release --config Release

      - name: Deploy Windows runtime
        shell: pwsh
        run: |
          Copy-Item installer/config/launcher-windows.json stage/windows/share/amalia/config/launcher.json -Force
          Copy-Item "$env:OPENSSL_ROOT_DIR/bin/*.dll" stage/windows/bin -Force
          Copy-Item "qtkeychain-install/bin/*.dll" stage/windows/bin -Force
          $keychainBin = (Resolve-Path "qtkeychain-install/bin").Path
          $env:PATH = "$keychainBin;$env:OPENSSL_ROOT_DIR\bin;$env:PATH"
          windeployqt --release --compiler-runtime -webenginecore -webenginewidgets -webchannel -positioning -sql --dir stage/windows/bin stage/windows/bin/amalia-desktop.exe
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed for amalia-desktop.exe ($LASTEXITCODE)" }
          windeployqt --release --compiler-runtime --dir stage/windows/bin stage/windows/bin/amalia-launcher.exe
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed for amalia-launcher.exe ($LASTEXITCODE)" }
          $sqlPlugin = Join-Path $env:QT_ROOT_DIR "plugins/sqldrivers/qsqlite.dll"
          if (-not (Test-Path $sqlPlugin)) { throw "Qt SQLite driver was not found: $sqlPlugin" }
          New-Item -ItemType Directory -Force stage/windows/bin/plugins/sqldrivers | Out-Null
          Copy-Item $sqlPlugin stage/windows/bin/plugins/sqldrivers/qsqlite.dll -Force

          $bin = (Resolve-Path "stage/windows/bin").Path
          $requiredLibraries = @(
            "Qt6Core.dll", "Qt6Gui.dll", "Qt6Widgets.dll", "Qt6Network.dll",
            "Qt6Sql.dll", "Qt6WebChannel.dll", "Qt6WebEngineCore.dll",
            "Qt6WebEngineWidgets.dll", "Qt6WebSockets.dll"
          )
          foreach ($library in $requiredLibraries) {
            if (-not (Test-Path (Join-Path $bin $library))) { throw "Qt runtime library missing: $library" }
          }
          foreach ($plugin in @("plugins/platforms/qwindows.dll", "plugins/sqldrivers/qsqlite.dll")) {
            if (-not (Test-Path (Join-Path $bin $plugin))) { throw "Qt runtime plugin missing: $plugin" }
          }
          foreach ($runtime in @("QtWebEngineProcess.exe", "icudtl.dat", "qtwebengine_resources.pak")) {
            if (-not (Get-ChildItem -Path $bin -Filter $runtime -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1)) {
              throw "Qt WebEngine runtime file missing: $runtime"
            }
          }
          if (-not (Get-ChildItem -Path $bin -Filter "*.pak" -File -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.Directory.Name -like "qtwebengine_locales*" } | Select-Object -First 1)) {
            throw "Qt WebEngine locale resources are missing"
          }
          if (-not (Get-ChildItem -Path $bin -Filter "*keychain*.dll" -File | Select-Object -First 1)) {
            throw "QtKeychain runtime library is missing"
          }
          foreach ($library in @("libcrypto-3-x64.dll", "libssl-3-x64.dll")) {
            if (-not (Test-Path (Join-Path $bin $library))) { throw "OpenSSL runtime library missing: $library" }
          }

      - name: Create installer
        shell: pwsh
        run: |
          $data = "installer/packages/fi.vapepa.amalia/data"
          if (Test-Path $data) { Remove-Item $data -Recurse -Force }
          New-Item -ItemType Directory -Path $data | Out-Null
          Copy-Item "stage/windows/*" $data -Recurse -Force
          foreach ($library in @("Qt6Core.dll", "Qt6WebEngineCore.dll", "Qt6WebEngineWidgets.dll")) {
            if (-not (Get-ChildItem -Path $data -Filter $library -File -Recurse | Select-Object -First 1)) {
              throw "Qt library was not included in the installer payload: $library"
            }
          }
          if (-not (Get-ChildItem -Path $data -Filter "QtWebEngineProcess.exe" -File -Recurse | Select-Object -First 1)) {
            throw "Qt WebEngine process was not included in the installer payload"
          }
          & $env:BINARYCREATOR -c installer/config/config.xml -p installer/packages AmaliaSetup.exe
          if (-not (Test-Path AmaliaSetup.exe)) { throw "AmaliaSetup.exe was not created" }
          Get-FileHash AmaliaSetup.exe -Algorithm SHA256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AmaliaSetup-2026.08.8
          path: AmaliaSetup.exe
          if-no-files-found: error

      - name: Publish installer in GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release upload $env:RELEASE_TAG AmaliaSetup.exe --clobber
