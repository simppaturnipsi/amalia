name: Build Windows installer

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub Release tag to update
        required: true
        default: v2026.08.8

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Check out Amalia
        uses: actions/checkout@v4

      - name: Install Qt, WebEngine and Qt Installer Framework
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtwebengine qtwebsockets qtpositioning qtwebchannel
          tools: tools_ifw,qt.tools.ifw.47
          cache: true

      - name: Install OpenSSL
        shell: pwsh
        run: choco install openssl --no-progress -y

      - name: Locate OpenSSL and installer tools
        shell: pwsh
        run: |
          $crypto = Get-ChildItem -Path "$env:ProgramFiles/OpenSSL*" -Recurse -Filter libcrypto-3-x64.dll | Select-Object -First 1
          $binaryCreator = Get-ChildItem -Path $env:IQTA_TOOLS -Recurse -Filter binarycreator.exe | Select-Object -First 1
          if (-not $crypto) { throw "OpenSSL 3 runtime was not found" }
          if (-not $binaryCreator) { throw "Qt Installer Framework binarycreator.exe was not found" }
          "OPENSSL_ROOT_DIR=$($crypto.Directory.Parent.FullName)" >> $env:GITHUB_ENV
          "BINARYCREATOR=$($binaryCreator.FullName)" >> $env:GITHUB_ENV

      - name: Build and install QtKeychain
        shell: pwsh
        run: |
          git clone --depth 1 --branch v0.14.0 https://github.com/frankosterfeld/qtkeychain.git qtkeychain-src
          cmake -S qtkeychain-src -B qtkeychain-build -G Ninja `
            -DBUILD_WITH_QT6=ON `
            -DBUILD_TEST_APPLICATION=OFF `
            -DBUILD_TRANSLATIONS=OFF `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="$pwd/qtkeychain-install"
          cmake --build qtkeychain-build --config Release
          cmake --install qtkeychain-build --config Release

      - name: Build Amalia
        shell: pwsh
        run: |
          cmake --preset windows-release `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR;$pwd/qtkeychain-install" `
            -DOPENSSL_ROOT_DIR="$env:OPENSSL_ROOT_DIR" `
            -DAMALIA_UPDATE_PUBLIC_KEY="$pwd/keys/update-public.pem"
          cmake --build --preset windows-release --config Release
          cmake --install build/windows-release --config Release

      - name: Deploy Windows runtime
        shell: pwsh
        run: |
          Copy-Item installer/config/launcher-windows.json stage/windows/share/amalia/config/launcher.json -Force
          windeployqt --release --compiler-runtime --dir stage/windows/bin stage/windows/bin/amalia-desktop.exe
          windeployqt --release --compiler-runtime --dir stage/windows/bin stage/windows/bin/amalia-launcher.exe
          Copy-Item "$env:OPENSSL_ROOT_DIR/bin/*.dll" stage/windows/bin -Force
          Copy-Item "qtkeychain-install/bin/*.dll" stage/windows/bin -Force

      - name: Create installer
        shell: pwsh
        run: |
          $data = "installer/packages/fi.vapepa.amalia/data"
          if (Test-Path $data) { Remove-Item $data -Recurse -Force }
          New-Item -ItemType Directory -Path $data | Out-Null
          Copy-Item "stage/windows/*" $data -Recurse -Force
          & $env:BINARYCREATOR -c installer/config/config.xml -p installer/packages AmaliaSetup.exe
          if (-not (Test-Path AmaliaSetup.exe)) { throw "AmaliaSetup.exe was not created" }
          Get-FileHash AmaliaSetup.exe -Algorithm SHA256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AmaliaSetup-2026.08.8
          path: AmaliaSetup.exe
          if-no-files-found: error

      - name: Publish installer in GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release upload $env:RELEASE_TAG AmaliaSetup.exe --clobber
